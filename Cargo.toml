[package]
name = "dg"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
cudarc = { version = "0.19.7", features = ["cuda-13020"] }
mpi = "0.8.1"
ndarray = "0.17.2"
ndarray-linalg = { version = "0.18.1", features = ["netlib-system"] }
ndarray-rand = "0.16.0"
num = "0.4.3"
num-derive = "0.4.2"
num-traits = "0.2.19"
paste = "1.0.15"
serde = { version = "1.0.228", features = ["derive"] }
toml = { version = "1.1.2", features = ["serde"] }
typetag = "0.2.22"
winnow = "1.0.2"
